<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trang doanh thu</title>

    <link rel="stylesheet" href="admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <nav class="sidebar">
        <div class="logo">
          <h2>ADMIN</h2>
        </div>

        <ul>
          <li>
            <a href="#"><i class="fas fa-home"></i> Tổng quan</a>
          </li>

          <li>
            <a href="listMovies.html"><i class="fas fa-box"></i> Sản phẩm</a>
          </li>

          <li>
            <a href="#"><i class="fas fa-user"></i> Người dùng</a>
          </li>

          <li>
            <a href="nhanvien.html">
              <i class="fa-solid fa-people-group"></i> Nhân viên
            </a>
          </li>

          <li class="active">
            <a href="#"><i class="fas fa-chart-line"></i> Doanh thu</a>
          </li>

          <li>
            <a href="#"><i class="fas fa-cog"></i> Cài đặt</a>
          </li>
        </ul>
      </nav>

      <div class="main-content">
        <header>
          <div class="search-bar">
            <input type="text" placeholder="Tìm kiếm..." />
          </div>

          <div class="user-info">
            <span>Xin chào, <strong>Admin</strong></span>
          </div>
        </header>

        <section class="dashboard-cards">
          <div class="card blue">
            <div>
              <div class="label">Vé đã bán</div>
              <div class="number">1000</div>
            </div>

            <i class="fa-solid fa-ticket"></i>
          </div>

          <div class="card green">
            <div>
              <div class="label">Doanh thu</div>
              <div class="number">53 600 000đ</div>
            </div>

            <i class="fa-solid fa-coins"></i>
          </div>

          <div class="card orange">
            <div>
              <div class="label">Khách hàng</div>
              <div class="number">1327</div>
            </div>

            <i class="fa-solid fa-users"></i>
          </div>
        </section>

        <div class="content-card">
          <div class="card-header">
            <h3>Biểu đồ doanh thu 7 ngày</h3>
          </div>

          <div
            style="height: 250px; background: #eef5fb; border-radius: 10px"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
