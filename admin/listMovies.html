<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard Concept</title>
    <link rel="stylesheet" href="admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <nav class="sidebar">
        <div class="logo">
          <h2>ADMIN</h2>
        </div>
        <ul>
          <li class="active">
            <a href="#"><i class="fas fa-home"></i> Tổng quan</a>
          </li>
          <li>
            <a href="listMovies.html"><i class="fas fa-box"></i> Sản phẩm</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-user"></i> Người dùng</a>
          </li>
          <li>
            <a href="nhanvien.html"
              ><i class="fa-solid fa-people-group"></i> Nhân viên</a
            >
          </li>
          <li>
            <a href="#"><i class="fas fa-chart-line"></i> Báo cáo</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-cog"></i> Cài đặt</a>
          </li>
        </ul>
      </nav>

      <main class="main-content">
        <header class="box_search_bar">
          <div class="search-bar">
            <input type="text" placeholder="Tìm kiếm phim..." />
          </div>
          <div class="user-profile">
            <span>Xin chào, <strong>Admin</strong></span>
            <img
              src="https://via.placeholder.com/35"
              alt="Avatar"
              class="avatar"
            />
          </div>
        </header>

        <section class="content-card">
          <div class="card-header">
            <h2>Danh sách Phim</h2>
            <button class="btn-add">+ Thêm phim mới</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Hình ảnh</th>
                  <th>Tên phim</th>
                  <th>Thể loại</th>
                  <th>Thời lượng</th>
                  <th>Trạng thái</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="movieTableBody">
                <tr>
                  <td>
                    <img
                      src="https://upload.wikimedia.org/wikipedia/vi/archive/b/b3/20260206043044%21Tho_oi_poster.jpg"
                      class="movie-img"
                    />
                  </td>
                  <td><strong>Thỏ Ơi</strong></td>
                  <td>Bí Ẩn, Tâm Lý</td>
                  <td>127 phút</td>
                  <td>
                    <span class="status-tag status-active">Đang chiếu</span>
                  </td>
                  <td>
                    <button class="btn-edit">
                      <a
                        href="updateMovies.html"
                        style="text-decoration: none; color: white"
                        >Sửa</a
                      >
                    </button>
                    <button class="btn-delete">Xóa</button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <img
                      src="https://dcine.vn/Areas/Admin/Content/Fileuploads/images/bauvattroichoPoster.jpg"
                      class="movie-img"
                    />
                  </td>
                  <td><strong>Báu Vật Trời Cho</strong></td>
                  <td>Hài, lãng mạn, gia đình</td>
                  <td>124 phút</td>
                  <td>
                    <span class="status-tag status-pending">đang chiếu</span>
                  </td>
                  <td>
                    <button class="btn-edit">Sửa</button>
                    <button class="btn-delete">Xóa</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <script>
        function deleteMovie(btn) {
          if (confirm("Bạn có chắc chắn muốn xóa phim này?")) {
            btn.closest("tr").remove();
          }
        }
        function addNewMovie() {
          alert("Chức năng thêm phim đang được cập nhật!");
        }
      </script>
    </div>
  </body>
</html>
